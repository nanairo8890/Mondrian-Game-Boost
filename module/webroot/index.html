<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08121b">
<title>Game Boost</title>
<!-- The manager serves this: --window-inset-* follow the system bars, and asking for it turns
     edge-to-edge on (KsuWebUI and normal browsers just get a 404) -->
<link rel="stylesheet" href="/internal/insets.css">
<style>
/* A dark instrument panel over an Aero sky. Everything here is static: the WebView draws on the
   app's own threads, so blur, filters and endless animations make the manager stop responding.
   The page only repaints what changes, once per sample. */
:root{
  --font:"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Roboto Mono","Noto Sans Mono",monospace;
  --text:#e8ecef;
  --text-2:#aab3bb;
  --text-3:#87919a;
  --accent:#4dbde8;
  --accent-lo:#2f9fcf;
  --amber:#dfa443;
  --red:#e0605a;
  --line-2:#d3dae0;
  --line-3:#7d8993;
  --recess:#07080a;
  --hair:rgba(255,255,255,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;background:#08121b;color:var(--text);font:13px/1.4 var(--font);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,p,figure,dl,dd,ul{margin:0}
b{font-weight:600}
button{font:inherit}
[hidden]{display:none!important}

/* Wallpaper: dark sky to light horizon, soft aurora streaks */
.wall{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;overflow:hidden;pointer-events:none;
  background:
    radial-gradient(90% 55% at 88% 6%,rgba(44,110,148,.40),rgba(44,110,148,0) 70%),
    linear-gradient(180deg,#050b12 0%,#091a27 24%,#103147 48%,#215f7a 70%,#5b9db6 86%,#a8d2e0 100%)}
.wall::before,.wall::after,.wall i{content:"";position:absolute;left:-40%;width:180%}
.wall::before{top:34%;height:34%;transform:rotate(-13deg);
  background:radial-gradient(50% 50% at 50% 50%,rgba(156,216,240,.18),rgba(156,216,240,0) 72%)}
.wall::after{top:14%;height:22%;transform:rotate(-23deg);
  background:radial-gradient(50% 50% at 50% 50%,rgba(108,178,224,.15),rgba(108,178,224,0) 72%)}
.wall i{top:53%;height:5%;transform:rotate(-16deg);
  background:radial-gradient(50% 50% at 50% 50%,rgba(222,245,255,.20),rgba(222,245,255,0) 75%)}

.defs{position:absolute;width:0;height:0;overflow:hidden}

.page{position:relative;z-index:1;max-width:560px;margin:0 auto;
  padding:calc(16px + var(--window-inset-top, 0px)) 12px calc(20px + var(--window-inset-bottom, 0px))}

/* Window */
.window{display:block;border-radius:6px;overflow:hidden;border:1px solid #000;
  box-shadow:0 0 0 1px rgba(255,255,255,.10),0 24px 48px -16px rgba(0,0,0,.75),0 4px 12px rgba(0,0,0,.35)}

/* Faceplate: name on the left, the state in a recessed readout on the right */
.plate{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px 12px;
  background:linear-gradient(180deg,#3d444b 0%,#30363c 48%,#2a2f34 52%,#272b30 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.6)}
.plate::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
  background:linear-gradient(112deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.05) 42%,rgba(255,255,255,0) 56%)}
.brand{min-width:0}
.app-name{font-size:16px;font-weight:600;line-height:1.2;letter-spacing:.01em;color:#f3f6f8}
.app-sub{margin-top:1px;font-size:11.5px;line-height:1.3;color:rgba(226,234,239,.66)}
.app-name .demo{margin-left:8px;padding:0 5px;border:1px solid rgba(223,164,67,.6);border-radius:2px;color:var(--amber);
  font-size:10.5px;font-weight:400;letter-spacing:0;vertical-align:2px}
.readout{position:relative;z-index:1;display:flex;align-items:center;gap:8px;flex:none;max-width:56%;min-height:32px;padding:5px 10px;
  border-radius:2px;background:var(--recess);border:1px solid #000;font-size:12.5px;font-weight:600;line-height:1.25;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.08)}

.client{padding:0 12px 12px;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.013) 0 1px,rgba(255,255,255,0) 1px 3px),
    repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0 1px,rgba(0,0,0,0) 1px 7px),
    linear-gradient(180deg,#2a2e32 0,#25282c 240px,#212427 100%)}
.state-note{padding:10px 0;border-bottom:1px solid rgba(0,0,0,.5);box-shadow:0 1px 0 rgba(255,255,255,.05);
  font-size:12.5px;color:var(--text-2)}

/* Lamps: green means on, amber a limit or a warning, red an error */
.lamp{display:inline-block;flex:none;width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#4b5157,#23272b 70%);
  box-shadow:0 0 0 1px #0a0b0c,0 1px 0 1px rgba(255,255,255,.06)}
.lamp.on{background:radial-gradient(circle at 35% 30%,#d4f6d2 0,#7fda80 26%,#3fa94a 68%,#2a7a33 100%)}
.lamp.warn{background:radial-gradient(circle at 35% 30%,#fbe7c2 0,#efbe62 26%,#c98a26 68%,#8f5f15 100%)}
.lamp.bad{background:radial-gradient(circle at 35% 30%,#fbd0cd 0,#ee7f78 26%,#c4433d 68%,#8c2a26 100%)}
.lamp.sm{width:8px;height:8px}

/* Instruments */
.instruments{padding:16px 0 4px}
.dials{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.dial{text-align:center}
.dial figcaption{margin-top:6px;font-size:12px;color:var(--text-2)}
.gauge{display:block;width:100%;max-width:200px;height:auto;margin:0 auto;overflow:visible}
.gauge text{font-family:var(--font)}
.gauge .gn{font-size:11px;fill:#adb5bc;text-anchor:middle}
.gauge .gro{font-size:16px;font-weight:600;fill:#eaeef1;text-anchor:middle;font-variant-numeric:tabular-nums}
.gauge .gu{font-size:10px;fill:#7f8992;text-anchor:middle}
.gauge .trk{fill:none;stroke:#2a3036;stroke-width:3.2}
.gauge .acc{fill:none;stroke:var(--accent);stroke-width:3.2}
.gauge .amb{fill:none;stroke:var(--amber);stroke-width:1.8}
.gauge .amb-f{fill:var(--amber);stroke:#0f1113;stroke-width:.8;stroke-linejoin:round}

/* Processor and GPU, under the gauges */
.hw{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;row-gap:2px;margin:14px 0 0;padding:8px 10px;
  border:1px solid rgba(0,0,0,.6);border-radius:3px;background:rgba(0,0,0,.18);box-shadow:0 1px 0 rgba(255,255,255,.05);font-size:12px;line-height:1.45}
.hw dt{color:var(--text-3);white-space:nowrap}
.hw dd{color:var(--text);overflow-wrap:anywhere}
.hw dd span{color:var(--text-3)}

.readouts{width:100%;margin-top:10px;border-collapse:collapse;font-size:12px}
.readouts th{padding:5px 0;font-weight:400;color:var(--text-2);text-align:left;vertical-align:middle}
.readouts td{padding:5px 0 5px 10px;white-space:nowrap;vertical-align:middle}
.readouts tr+tr th,.readouts tr+tr td{border-top:1px solid var(--hair)}
.k{display:inline-block;width:12px;height:10px;margin-right:6px;vertical-align:-1px}
.k-acc{color:var(--accent)}
.k-amb{color:var(--amber)}
.n{display:inline-block;min-width:4ch;text-align:right;font-size:13px;font-weight:600;color:#eaeef1;font-variant-numeric:tabular-nums}
.n.n2{min-width:2ch}
.n.dim{color:var(--text-3);font-weight:400}
.n.hot{color:var(--amber)}
.u{margin-left:3px;font-size:11.5px;color:var(--text-3)}
.m{margin-left:6px;font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}

/* Front panel lamps: a lamp, its printed label and the value under it */
.panel{list-style:none;margin:12px 0 0;padding:12px 0 2px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:8px;
  border-top:1px solid rgba(0,0,0,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.04);text-align:center}
.panel li{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.panel .lamp{width:9px;height:9px}
.panel .pl{font-size:11px;line-height:1.25;color:var(--text-3)}
.panel .pv{font-size:12px;line-height:1.3;color:var(--text);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* Group boxes */
.group{margin:14px 0 0;padding:4px 12px 10px;min-width:0;border:1px solid rgba(255,255,255,.11);border-radius:4px}
.group>legend{padding:0 6px;margin-left:-2px;font-size:12px;font-weight:600;color:#c7ced4}

.ctl{padding:8px 0 9px}
.ctl+.ctl{border-top:1px solid rgba(255,255,255,.05)}
.ctl-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-right:96px;font-size:12.5px;line-height:1.3}
.rom{font-size:11px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.ctl-row,.ctl-flat{display:grid;grid-template-columns:minmax(0,1fr) 84px;column-gap:12px;align-items:center}
.ctl-row{margin-top:4px}
.ctl-flat{font-size:12.5px}

.slider{position:relative;height:28px}
.slider::after{content:"";position:absolute;left:5px;right:5px;bottom:0;height:3px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.15) 0 1px,rgba(255,255,255,0) 1px 10%);
  border-right:1px solid rgba(255,255,255,.15)}
.trk-s{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;background:var(--recess);
  box-shadow:inset 0 1px 1px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.07)}
.fil{position:absolute;left:0;top:11px;height:4px;border-radius:2px 0 0 2px;
  width:calc(var(--v) * (100% - 10px) + 5px);background:linear-gradient(180deg,#7ad1f1,var(--accent-lo))}
.romk{position:absolute;top:7px;width:2px;height:12px;border-radius:1px;
  left:calc(var(--r) * (100% - 10px) + 4px);background:#e8ecef;box-shadow:0 0 0 1px rgba(0,0,0,.55)}
.thm{position:absolute;top:4px;width:10px;height:18px;border-radius:2px;left:calc(var(--v) * (100% - 10px));
  background:linear-gradient(180deg,#f1f3f5,#bcc3c9 55%,#8e969d);border:1px solid #111315;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 1px 2px rgba(0,0,0,.55)}
.thm::after{content:"";position:absolute;left:3.5px;top:4px;bottom:4px;width:1px;background:rgba(0,0,0,.25)}

.vbox{display:flex;align-items:baseline;justify-content:flex-end;gap:4px;height:28px;padding:0 6px 0 8px;
  border-radius:2px;background:var(--recess);border:1px solid #000;line-height:26px;white-space:nowrap;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.07);font-variant-numeric:tabular-nums}
.vbox b{font-size:14px;color:#e9eef1}
.vbox i{width:26px;font-style:normal;font-size:11px;color:var(--text-3)}

.note{margin-top:4px;padding-top:10px;border-top:1px solid rgba(255,255,255,.05);font-size:12px;line-height:1.45;color:var(--text-2)}

/* Profile keys */
.keys{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding-top:6px}
.kgrp{display:flex;gap:4px}
.kcell{display:flex;flex-direction:column;align-items:center;gap:6px;width:66px}
.kcap{max-width:100%;font-size:11px;line-height:1.2;color:var(--text-2);text-align:center}
.kcell.sel .kcap{color:var(--text)}
.kcell.off .kcap{color:var(--text-3)}
.key{position:relative;display:grid;place-items:center;width:40px;height:40px;padding:0;margin:0;cursor:pointer;
  -webkit-appearance:none;appearance:none;border:1px solid #0b0c0e;border-radius:3px;color:#e3e8ec;
  font:600 15px/1 var(--font);
  background:linear-gradient(180deg,#42474d,#2e3237 58%,#282b2f);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(0,0,0,.45)}
.key:active{background:linear-gradient(180deg,#25282c,#2c3034)}
.key[aria-checked="true"]{color:var(--accent);background:linear-gradient(180deg,#1a1d20,#24272b);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.07)}
.key[aria-checked="true"]::after{content:"";position:absolute;left:11px;right:11px;bottom:5px;height:2px;border-radius:1px;background:var(--accent)}
.key:disabled{cursor:default;color:#677079;background:linear-gradient(180deg,#34383d,#2b2e32);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.key svg{width:18px;height:18px}
.pdesc{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.05)}
.pmeta{font-size:11px;color:var(--text-3)}
.pdesc p{margin-top:3px;font-size:12.5px;line-height:1.45;color:var(--text-2)}
.pdesc p b{color:var(--text)}
.pending{display:flex;align-items:center;gap:12px;margin-top:10px;padding:8px 10px;border:1px solid rgba(223,164,67,.45);border-radius:3px;
  background:rgba(223,164,67,.07)}
.pending p{flex:1;font-size:12px;line-height:1.4;color:#ead2a6}

/* Text buttons (dialog, restart) */
.btn{min-width:84px;height:34px;padding:0 14px;cursor:pointer;border:1px solid #0b0c0e;border-radius:3px;color:#e3e8ec;font-size:12.5px;font-weight:600;
  background:linear-gradient(180deg,#42474d,#2e3237 58%,#282b2f);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(0,0,0,.45)}
.btn:active{background:linear-gradient(180deg,#25282c,#2c3034)}
.btn.pri{color:#06202c;border-color:#0d3a4d;background:linear-gradient(180deg,#8fd8f4,#4dbde8 58%,#36a8d6);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 2px rgba(0,0,0,.45)}
.btn.warn{color:#2c1a02;border-color:#4d3205;background:linear-gradient(180deg,#f3cf8a,#dfa443 58%,#c98f30);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 2px rgba(0,0,0,.45)}

/* Hardware monitor */
.monitor{margin-top:14px;overflow:hidden;border:1px solid #000;border-radius:4px;background:#141618;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.mon-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;padding:6px 10px;
  border-bottom:1px solid #000;background:linear-gradient(180deg,#30353a,#25282c);box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
.mon-bar h2{font-size:13px;font-weight:600}
.mon-key{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-2);white-space:nowrap}
.band-key{width:12px;height:10px;background:rgba(95,200,105,.16);border-left:1px solid rgba(95,200,105,.6)}
.graphs{padding:2px 10px 8px}
.graph{padding-top:10px}
.g-head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin:0 0 5px 30px}
.g-title{font-size:12px;line-height:1.3}
.g-sub{min-height:15px;font-size:11px;line-height:1.35;color:var(--text-3);font-variant-numeric:tabular-nums}
.g-now{font-size:16px;font-weight:600;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.g-now small{margin-left:4px;font-size:11px;font-weight:400;color:var(--text-3)}
.g-leg{display:flex;flex-wrap:wrap;column-gap:12px;min-height:15px;font-size:11px;line-height:1.35;color:var(--text-3);font-variant-numeric:tabular-nums}
.g-leg b{color:var(--text)}
.sw{display:inline-block;width:10px;height:2px;margin-right:4px;vertical-align:middle;background:currentColor}
.c1{color:var(--accent)}
.c2{color:var(--line-2)}
.c3{color:var(--line-3)}
.g-body{display:grid;grid-template-columns:30px minmax(0,1fr)}
.g-axis{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;
  padding-right:6px;font-size:10px;line-height:1;color:var(--text-3);font-variant-numeric:tabular-nums}
.g-axis .lim-l{position:absolute;right:6px;transform:translateY(-50%);color:var(--amber)}
.plot{position:relative;height:58px;overflow:hidden;border:1px solid #000;border-radius:2px;
  background-color:#040506;
  background-image:linear-gradient(90deg,rgba(255,255,255,.06) 1px,rgba(255,255,255,0) 1px),
                   linear-gradient(180deg,rgba(255,255,255,.06) 1px,rgba(255,255,255,0) 1px);
  background-size:12.5% 100%,100% 25%;
  box-shadow:0 1px 0 rgba(255,255,255,.05)}
.plot svg{position:absolute;top:0;left:0;width:100%;height:100%}
.plot path{fill:none;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.plot .ln{stroke:var(--accent)}
.plot .ln-2{stroke:var(--line-2)}
.plot .ln-3{stroke:var(--line-3)}
.plot .bands{fill:rgba(95,200,105,.075);stroke:none}
.plot .edges{stroke:rgba(95,200,105,.42);stroke-width:1}
.lim{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(223,164,67,.75)}
.t-axis{position:relative;height:14px;margin:5px 0 0 30px;font-size:10px;line-height:14px;color:var(--text-3)}
.t-axis span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.t-axis span:first-child{transform:none}
.t-axis span:last-child{transform:translateX(-100%)}

/* Collapsed rows */
.xps{margin-top:14px}
.xp{border-top:1px solid rgba(0,0,0,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.xp summary{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 2px;font-size:13px;cursor:pointer;list-style:none}
.xp summary::-webkit-details-marker{display:none}
.xp summary::marker{content:""}
.chev{flex:none;width:12px;height:12px;color:var(--text-3)}
.xp[open] .chev{transform:rotate(90deg)}
.xp-body{padding:0 2px 12px 22px;font-size:12.5px;line-height:1.45;color:var(--text-2)}
.xp-body ul{padding-left:16px}
.xp-body li+li{margin-top:6px}
.xp-body li b{color:var(--text)}
.xp-body li.alert{color:#ead2a6}
.log{margin:0;padding:8px 10px;border:1px solid #000;border-radius:2px;background:var(--recess);
  font:10.5px/1.6 var(--mono);color:#b9c2c9;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow-y:auto}

/* Details pane (window bottom) */
.details{padding:10px 12px 12px;border-top:1px solid #000;
  background:linear-gradient(180deg,#1e2124,#191b1e);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.details dl{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;row-gap:4px;font-size:12px;line-height:1.4}
.details dt{color:var(--text-3);text-align:right;white-space:nowrap}
.details dd{display:flex;align-items:center;gap:6px;color:var(--text);font-variant-numeric:tabular-nums}

.credits{margin:14px 4px 0;font-size:11px;line-height:1.5;text-align:center;color:rgba(10,28,40,.82)}

/* Dialog and toast */
.veil{position:fixed;top:0;right:0;bottom:0;left:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(2,8,14,.62)}
.dlg{width:100%;max-width:360px;overflow:hidden;border:1px solid #000;border-radius:5px;
  box-shadow:0 0 0 1px rgba(255,255,255,.10),0 18px 40px rgba(0,0,0,.7)}
.dlg-bar{padding:10px 12px;font-size:13.5px;font-weight:600;color:#f3f6f8;
  background:linear-gradient(180deg,#3d444b 0%,#30363c 48%,#2a2f34 52%,#272b30 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.6)}
.dlg-body{padding:14px 12px 12px;background:linear-gradient(180deg,#2a2e32,#232629)}
.dlg-body p{font-size:12.5px;line-height:1.5;color:var(--text-2)}
.dlg-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;z-index:20;left:50%;bottom:calc(28px + var(--window-inset-bottom, 0px));transform:translateX(-50%);
  width:max-content;max-width:calc(100% - 32px);padding:8px 12px;border:1px solid #000;border-radius:3px;
  background:#2a2e32;color:var(--text);font-size:12.5px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 6px 16px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div class="wall" aria-hidden="true"><i></i></div>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g-bz1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4cbd1"/>

    } else {

      hist.forEach(function (s) { var v = s[k]; if (typeof v === "number") { if (v < mn) mn = v; if (v > mx) mx = v; } });
      txt(g.sub, mx === -Infinity ? "" : L.gMin + " " + fv(mn, g) + " · " + L.gMax + " " + fv(mx, g));
      var cur = last ? num(last[k]) : null;
      var nw = esc(fv(cur, g)) + (g.id === "power" && last && last.chg && cur !== null ? "<small>" + esc(L.charging) + "</small>" : "");
      html(g.now, nw);
    }
  }
  function drawGraphs() { GRAPHS.forEach(drawGraph); }

  /* ----- dialogs and actions ----- */
  function ask(title, text, yes, cls2) {
    return new Promise(function (resolve) {
      txt("dlgT", title); txt("dlgP", text); txt("dlgYes", yes);
      $("dlgYes").className = "btn " + (cls2 || "pri");
      $("veil").hidden = false;
      function done(v) { $("veil").hidden = true; $("dlgYes").onclick = $("dlgNo").onclick = null; resolve(v); }
      $("dlgYes").onclick = function () { done(true); };
      $("dlgNo").onclick = function () { done(false); };
    });
  }
  function choose(level) { if (!st) return; preview = level; renderProfile(); }
  $("slotAlto").onclick = function () { choose("alto"); };
  $("slotMax").onclick = function () { choose("maximo"); };
  $("btnUndo").onclick = function () { preview = saved(); renderProfile(); };
  var applying = false;
  $("btnApply").onclick = function () {
    var level = preview;
    if (!st || !level || applying) return;
    if (st.level === level) { toast(L.same); return; }
    ask(L.dlgLevelT, level === "maximo" ? L.dlgMaxP : L.dlgAltoP, L.yesLevel, level === "maximo" ? "warn" : "pri").then(function (yes) {
      if (!yes) return;
      applying = true;
      /* the power HAL restarts (about 2 s, the page waits): say so and let it paint first */
      txt("pMeta", L.applying);
      $("btnApply").disabled = $("btnUndo").disabled = $("slotAlto").disabled = $("slotMax").disabled = true;
      setTimeout(function () {
        run(["level", level]).then(function (s) {
          applying = false;
          if (s && s.level === level) { showStatus(s); toast(s.active === level ? L.levelApplied : L.levelSaved); }
          else { renderProfile(); toast(L.error); }
        });
      }, 80);
    });
  };
  $("btnReboot").onclick = function () {
    ask(L.dlgRebootT, L.dlgRebootP, L.yesReboot, "warn").then(function (yes) { if (yes) run(["reboot"]); });
  };
  $("logBox").addEventListener("toggle", function () {
    if (!$("logBox").open) return;
    run(["log"]).then(function (s) { txt("logText", typeof s === "string" && s.trim() ? s : "–"); });
  });

  /* ----- demo data (a normal browser has no ksu bridge) ----- */
  var demoLevel = "alto", demoActive = "alto", demoStat = [912345, 2345, 456789, 8123456, 12345, 23456, 11234, 0];
  function demoExec(cmd) {
    var t = Date.now() / 1000, game = Math.floor(t / 20) % 2 === 0, w = function (a, b) { return a + (Math.sin(t * b) + 1) / 2; };
    if (/ live$/.test(cmd)) {
      var busy = game ? 0.55 + 0.2 * Math.sin(t * 0.6) : 0.08 + 0.04 * Math.sin(t);
      demoStat[0] += Math.round(1200 * busy * 0.7); demoStat[2] += Math.round(1200 * busy * 0.3); demoStat[3] += Math.round(1200 * (1 - busy));
      return JSON.stringify({ cpu: [game ? 1804800 : 1132800, Math.round(game ? w(1900000, 1.3) + 400000 : 940800), Math.round(game ? w(2400000, 0.9) + 500000 : 1036800)],
        cpuCap: [2016000, game ? 2745600 : 2572800, game ? 3187200 : 2246400], cpuTop: [2016000, 2745600, 3187200],
        gpu: game ? Math.round(w(580, 0.7) * 1e6 + 200e6) : 220e6, gpuTop: 900e6, gpuCap: 900e6, gpuBusy: game ? Math.round(w(70, 1.1) + 18) : 6,
        tCpu: game ? Math.round(w(470, 0.2) + 20) : 365, tGpu: game ? Math.round(w(440, 0.25) + 20) : 352, tBatt: game ? 384 : 331, tBoard: game ? Math.round(41000 + 2500 * Math.sin(t / 9)) : 34200,
        scene: game ? (demoLevel === "maximo" ? 10 : 13) : 0, game: game,
        stat: demoStat.slice(), mem: [11634892, Math.round(game ? 4100000 + 300000 * Math.sin(t / 5) : 6900000)],
        bI: Math.round(game ? 1450000 + 300000 * Math.sin(t * 0.7) : 380000), bV: 4182000, chg: false });
    }
    var m = cmd.match(/ level (\w+)$/); if (m) demoLevel = demoActive = m[1];
    if (/ log$/.test(cmd)) return JSON.stringify("Tue Oct 21 18:00:00 -03 2026\nBoost de juegos activo, nivel alto y estable\nlevel: alto; post-fs-data: alto; power HAL: ok, running\nmetamodule: /data/adb/modules/nomount\nGAME: GAME\t3\t1820450\nsconfig: 0");
    if (/ reboot$/.test(cmd)) return "";
    return JSON.stringify({ version: "v1.0", level: demoLevel, active: demoActive, hal: "ok", code: "active", ok: true, late: false,
      locale: navigator.language || "en", metamodule: "/data/adb/modules/nomount", thermalProfiles: false, gameCount: 3, disabled: false,
      soc: "SM8475", gpuModel: "Adreno730v3", driver: "V@0615.95" });
  }

  /* ----- start ----- */
  /* MODDIR is the manager's modDir for this module (/data/adb/modules/<id>), so no moduleInfo call */
  if (hasKsu) {
    try { if (window.ksu.enableEdgeToEdge) window.ksu.enableEdgeToEdge(true); } catch (e) {}
  } else {
    $("demo").hidden = false;
  }
  setLang(navigator.language);
  buildSliders(); buildGraphs();
  applyText();
  /* paint first */
  setTimeout(function () {
    run(["status"]).then(showStatus);
    startMonitor();
  }, 60);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    if (lastLive) render(lastLive);
    drawGraphs();
    setTimeout(function () { run(["status"]).then(showStatus); tick(); }, 60);
  });
})();
</script>
</body>
</html>
